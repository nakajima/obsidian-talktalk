name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag" != "$manifest_version" ]]; then
            echo "Tag $tag does not match manifest.json version $manifest_version" >&2
            exit 1
          fi

          if [[ "$tag" != "$package_version" ]]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(main.js manifest.json styles.css)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --generate-notes \
              "${assets[@]}"
          fi
